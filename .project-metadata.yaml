name: Anywhere AI Studio
description: >-
  Governed credit risk intelligence: ask questions of Trino data through a governed semantic layer,
  answer from policy documents with page-level citations, and call an approval-likelihood model through MCP.
author: Cloudera
date: "2026-10-30"
specification_version: 1.0
prototype_version: 1.0

runtimes:
  - editor: JupyterLab
    kernel: Python 3.10
    edition: Standard

# No variables are declared on purpose. The Cloudera AI import form can save a value you edit as "[object Object]", which
# makes the deploy job fail. Everything the AMP needs has a default in code (STUDIO_REPO_ROOT is set on each Application by
# deployment/cai/manifests/applications.yaml). Add API keys, Trino credentials and options in Project Settings -> Advanced
# after the import (see README), then run the Deploy applications job.

tasks:
  - type: create_job
    name: Install tools and dependencies
    entity_label: install-tools
    short_summary: Node.js, Backend virtualenv, Qdrant, embedding model, data folders and Frontend packages
    long_summary: >-
      Installs everything an Application cannot download. Safe to run again; finished steps are skipped.
      Takes several minutes (the embedding model is about 2.3 GB).
    script: scripts/amp/setup.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 120

  - type: run_job
    entity_label: install-tools
    wait_for: true

  - type: create_job
    name: Deploy applications
    entity_label: deploy-applications
    short_summary: Builds the UI and creates or updates the Qdrant, Backend and Frontend Applications through the CAI API
    long_summary: >-
      Reads deployment/cai/manifests/applications.yaml, forwards this project's environment variables to each
      Application, builds the Frontend, then creates (or updates and restarts) the Applications and waits until they run.
      Run this job again after a git pull to redeploy, or after adding an environment variable.
    script: scripts/amp/deploy.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 90

  - type: run_job
    entity_label: deploy-applications
    wait_for: true

  # Not run at import: the code was just cloned. Run it later whenever new commits are on GitHub.
  - type: create_job
    name: Update from GitHub
    entity_label: update-from-github
    short_summary: git pull from GitHub, then redeploy the Applications when something changed
    long_summary: >-
      Replaces opening a Session to run git pull. Pulls the current branch as a fast-forward only (it never merges or
      discards local edits and stops with instructions if it cannot), installs new Backend requirements when they changed,
      and runs the Deploy applications script. When nothing new was pulled it stops without redeploying.
    script: scripts/amp/update.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 90
