name: Anywhere AI Studio
description: >-
  Governed credit risk intelligence: ask questions of Trino data through a governed semantic layer,
  answer from policy documents with page-level citations, and call an approval-likelihood model through MCP.
author: Cloudera
date: "2026-10-30"
specification_version: 1.0
prototype_version: 1.0

runtimes:
  - editor: JupyterLab
    kernel: Python 3.10
    edition: Standard

environment_variables:
  GEMINI_API_KEY:
    default: ""
    description: Gemini API key (set at least one LLM key; the provider and model are chosen later in Settings -> AI Models).
    required: false
  OPENAI_API_KEY:
    default: ""
    description: OpenAI (or OpenAI-compatible) API key. Optional.
    required: false
  ANTHROPIC_API_KEY:
    default: ""
    description: Anthropic API key. Optional.
    required: false
  TRINO_HOST:
    default: ""
    description: Trino host (for example a Cloudera Data Warehouse Trino Virtual Warehouse).
    required: false
  TRINO_USER:
    default: ""
    description: Trino user.
    required: false
  TRINO_PASSWORD:
    default: ""
    description: Trino password. The Data Source references it as env://TRINO_PASSWORD.
    required: false
  TRINO_CATALOG:
    default: hive
    description: Trino catalog that holds the demo tables.
    required: false
  TRINO_SCHEMA:
    default: default
    description: Trino schema that holds the demo tables.
    required: false
  STUDIO_REPO_ROOT:
    default: /home/cdsw
    description: Where the project files live. Leave as is for an AMP.
    required: true
  ENABLE_VLLM:
    default: "false"
    description: Set to true to also create the vLLM Application (serves your own model). Needs GPU nodes in the workspace, a GPU-enabled runtime and model weights. Leave false to use an external model endpoint or an API key instead.
    required: false
  VLLM_MODEL_ID:
    default: ""
    description: Hugging Face model id to download for vLLM (only when ENABLE_VLLM is true). Gated models also need HUGGING_FACE_HUB_TOKEN.
    required: false
  AMP_VLLM_RUNTIME_ID:
    default: ""
    description: GPU-enabled runtime identifier for the vLLM Application (only when ENABLE_VLLM is true).
    required: false
  GPU_PROFILE:
    default: h200
    description: GPU tuning profile for vLLM (h200, l40s or a10g). Only used when ENABLE_VLLM is true.
    required: false
  AMP_FORWARD_ENV:
    default: ""
    description: Extra variable names (comma separated) to copy to the Backend, for example the secrets a Data Source or MCP server needs (MY_DB_PASSWORD,MY_TOOL_TOKEN). Add the variables themselves in the project settings.
    required: false
  AMP_RUNTIME_ID:
    default: ""
    description: Runtime identifier for the Applications. Leave empty to use the workspace default.
    required: false
  IMPALA_HOST:
    default: ""
    description: Impala host, if the Data Source is Impala. Optional.
    required: false
  IMPALA_USER:
    default: ""
    description: Impala user. Optional.
    required: false
  IMPALA_PASSWORD:
    default: ""
    description: Impala password. Optional.
    required: false
  POSTGRES_PASSWORD:
    default: ""
    description: PostgreSQL password, if the Data Source is PostgreSQL. Optional.
    required: false
  AMP_SUBDOMAIN_PREFIX:
    default: anywhere
    description: Prefix of the Application subdomains (<prefix>-qdrant, -backend, -frontend). Change it if they collide with other Applications in your workspace.
    required: true

tasks:
  - type: create_job
    name: Install tools and dependencies
    entity_label: install-tools
    short_summary: Node.js, Backend virtualenv, Qdrant, embedding model, data folders and Frontend packages
    long_summary: >-
      Installs everything an Application cannot download. Safe to run again; finished steps are skipped.
      Takes several minutes (the embedding model is about 2.3 GB).
    script: scripts/amp/setup.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 120

  - type: run_job
    entity_label: install-tools
    wait_for: true

  - type: create_job
    name: Deploy applications
    entity_label: deploy-applications
    short_summary: Builds the UI and creates or updates the Qdrant, Backend and Frontend Applications through the CAI API
    long_summary: >-
      Reads deployment/cai/manifests/applications.yaml, forwards this project's environment variables to each
      Application, builds the Frontend, then creates (or updates and restarts) the Applications and waits until they run.
      Run this job again after a git pull to redeploy, or after adding an environment variable.
    script: scripts/amp/deploy.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 90

  - type: run_job
    entity_label: deploy-applications
    wait_for: true
