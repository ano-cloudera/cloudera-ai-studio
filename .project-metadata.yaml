name: Anywhere AI Studio
description: >-
  Governed credit risk intelligence: ask questions of Trino data through a governed semantic layer,
  answer from policy documents with page-level citations, and call an approval-likelihood model through MCP.
author: Cloudera
date: "2026-10-30"
specification_version: 1.0
prototype_version: 1.0

runtimes:
  - editor: JupyterLab
    kernel: Python 3.10
    edition: Standard

# Only variables with a real default are declared. The Cloudera AI import form can save an edited value as "[object Object]",
# and Project Settings refuses to save while a variable is empty. Add API keys, Trino or Impala credentials and the other
# optional variables in Project Settings -> Advanced after the import (see README), then run the Deploy applications job.
environment_variables:
  TRINO_CATALOG:
    default: hive
    description: Trino catalog that holds the demo tables.
    required: false
  TRINO_SCHEMA:
    default: default
    description: Trino schema that holds the demo tables.
    required: false
  STUDIO_REPO_ROOT:
    default: /home/cdsw
    description: Where the project files live. Leave as is for an AMP.
    required: true
  ENABLE_VLLM:
    default: "false"
    description: Set to true to also create the vLLM Application (serves your own model). Needs GPU nodes in the workspace, a GPU-enabled runtime and model weights. Leave false to use an external model endpoint or an API key instead.
    required: false
  GPU_PROFILE:
    default: h200
    description: GPU tuning profile for vLLM (h200, l40s or a10g). Only used when ENABLE_VLLM is true.
    required: false
  AMP_SUBDOMAIN_PREFIX:
    default: anywhere
    description: Prefix of the Application subdomains (<prefix>-qdrant, -backend, -frontend). Change it if they collide with other Applications in your workspace.
    required: true

tasks:
  - type: create_job
    name: Install tools and dependencies
    entity_label: install-tools
    short_summary: Node.js, Backend virtualenv, Qdrant, embedding model, data folders and Frontend packages
    long_summary: >-
      Installs everything an Application cannot download. Safe to run again; finished steps are skipped.
      Takes several minutes (the embedding model is about 2.3 GB).
    script: scripts/amp/setup.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 120

  - type: run_job
    entity_label: install-tools
    wait_for: true

  - type: create_job
    name: Deploy applications
    entity_label: deploy-applications
    short_summary: Builds the UI and creates or updates the Qdrant, Backend and Frontend Applications through the CAI API
    long_summary: >-
      Reads deployment/cai/manifests/applications.yaml, forwards this project's environment variables to each
      Application, builds the Frontend, then creates (or updates and restarts) the Applications and waits until they run.
      Run this job again after a git pull to redeploy, or after adding an environment variable.
    script: scripts/amp/deploy.py
    kernel: python3
    cpu: 2
    memory: 8
    timeout: 90

  - type: run_job
    entity_label: deploy-applications
    wait_for: true
