version: "0.2.0.dev0"
name: fulfillment
description: x
datasets:
  - name: fulfillment_orders
    source: '"hive"."default"."fulfillment_orders"'
    primary_key: [order_id]
    fields:
      - name: fulfillment_orders_order_id
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
      - name: fulfillment_orders_order_date
        datatype: Date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_date
        dimension:
          is_time: true
      - name: fulfillment_orders_region_name
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: region_name
      - name: fulfillment_orders_warehouse
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: warehouse
      - name: fulfillment_orders_channel
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: channel
      - name: fulfillment_orders_product_category
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: product_category
      - name: fulfillment_orders_items
        datatype: Number
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: items
      - name: fulfillment_orders_order_value
        datatype: Number
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_value
      - name: fulfillment_orders_fulfillment_hours
        datatype: Number
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: fulfillment_hours
      - name: fulfillment_orders_order_status
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_status
  - name: delivery_shipments
    source: '"hive"."default"."delivery_shipments"'
    primary_key: [shipment_id]
    fields:
      - name: delivery_shipments_shipment_id
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: shipment_id
      - name: delivery_shipments_order_id
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
      - name: delivery_shipments_region_name
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: region_name
      - name: delivery_shipments_carrier
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: carrier
      - name: delivery_shipments_service_level
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: service_level
      - name: delivery_shipments_ship_date
        datatype: Date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: ship_date
        dimension:
          is_time: true
      - name: delivery_shipments_delivered_date
        datatype: Date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: delivered_date
      - name: delivery_shipments_delivery_days
        datatype: Number
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: delivery_days
      - name: delivery_shipments_sla_days
        datatype: Number
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: sla_days
      - name: delivery_shipments_is_late
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: is_late
      - name: delivery_shipments_delivery_status
        datatype: String
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: delivery_status
metrics:
  - name: total_orders
    description: "Total number of orders."
    ai_context:
      synonyms: ["orders", "order count"]
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(order_id)
    custom_extensions:
      - vendor_name: REFERENCE
        data: '{"base_dataset": "fulfillment_orders", "allowed_dimensions": ["fulfillment_orders_order_id","fulfillment_orders_order_date","fulfillment_orders_region_name","fulfillment_orders_warehouse","fulfillment_orders_channel","fulfillment_orders_product_category","fulfillment_orders_items","fulfillment_orders_order_value","fulfillment_orders_fulfillment_hours","fulfillment_orders_order_status"]}'
  - name: total_order_value_idr
    description: "Total order value in IDR."
    ai_context:
      synonyms: ["order value", "nilai order", "revenue"]
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(order_value)
    custom_extensions:
      - vendor_name: REFERENCE
        data: '{"base_dataset": "fulfillment_orders", "allowed_dimensions": ["fulfillment_orders_order_id","fulfillment_orders_order_date","fulfillment_orders_region_name","fulfillment_orders_warehouse","fulfillment_orders_channel","fulfillment_orders_product_category","fulfillment_orders_items","fulfillment_orders_order_value","fulfillment_orders_fulfillment_hours","fulfillment_orders_order_status"]}'
  - name: cancellation_rate
    description: "Share of cancelled orders (%)."
    ai_context:
      synonyms: ["cancel rate", "cancellation rate"]
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(CASE WHEN order_status = 'Cancelled' THEN 1 END) * 100.0 / COUNT(order_id)
    custom_extensions:
      - vendor_name: REFERENCE
        data: '{"base_dataset": "fulfillment_orders", "allowed_dimensions": ["fulfillment_orders_order_id","fulfillment_orders_order_date","fulfillment_orders_region_name","fulfillment_orders_warehouse","fulfillment_orders_channel","fulfillment_orders_product_category","fulfillment_orders_items","fulfillment_orders_order_value","fulfillment_orders_fulfillment_hours","fulfillment_orders_order_status"]}'
  - name: late_delivery_rate
    description: "Share of shipments delivered late (%)."
    ai_context:
      synonyms: ["late rate", "delay rate", "SLA breach rate"]
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(CASE WHEN is_late = 'true' THEN 1 END) * 100.0 / COUNT(shipment_id)
    custom_extensions:
      - vendor_name: REFERENCE
        data: '{"base_dataset": "delivery_shipments", "allowed_dimensions": ["delivery_shipments_shipment_id","delivery_shipments_order_id","delivery_shipments_region_name","delivery_shipments_carrier","delivery_shipments_service_level","delivery_shipments_ship_date","delivery_shipments_delivered_date","delivery_shipments_delivery_days","delivery_shipments_sla_days","delivery_shipments_is_late","delivery_shipments_delivery_status"]}'
  - name: total_shipments
    description: "Number of shipments."
    ai_context:
      synonyms: ["shipments", "parcels"]
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(shipment_id)
    custom_extensions:
      - vendor_name: REFERENCE
        data: '{"base_dataset": "delivery_shipments", "allowed_dimensions": ["delivery_shipments_shipment_id","delivery_shipments_order_id","delivery_shipments_region_name","delivery_shipments_carrier","delivery_shipments_service_level","delivery_shipments_ship_date","delivery_shipments_delivered_date","delivery_shipments_delivery_days","delivery_shipments_sla_days","delivery_shipments_is_late","delivery_shipments_delivery_status"]}'
