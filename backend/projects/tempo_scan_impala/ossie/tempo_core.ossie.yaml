- name: sat_promo_material_uplift
  source: gold.rpt_sat_promo_material_uplift
  primary_key:
  - material
  description: Cross-channel ROI/uplift proxy for SAT Promo (Alfamart) materials - General Trade Sell-In revenue/quantity/margin,
    November 2024 (baseline) vs December 2024 (promo month), for the 77 SAP material codes that appear in SAT Promo.
  ai_context:
    instructions: This is a PROXY, not a direct measurement of the Alfamart promo's own ROI - SAT Promo (the Alfamart/B2B
      promo program) has no structured cost column (only a free-text "mekanisme" field) and only covers December 2024
      with no same-channel baseline, so no direct ROI/cost metric is possible from SAT Promo itself. This dataset instead
      measures whether General Trade (a DIFFERENT channel from where the promo ran) also saw a sales change for the same
      material codes between Nov and Dec - a cross-channel "halo effect" proxy, confirmed structurally valid (SAT Promo's
      material_code is 100% (77/77) resolvable against this dataset's material, both using the same SAP material code
      space) but not a causal attribution. Always label results as a proxy/indirect signal, never as "the promo's ROI"
      outright. margin_val uses zcost, confirmed by Tempo's own custom_key_figure_sales reference table to mean "COGS
      Value" - aggregate COGS/revenue ratio sanity-checked at ~85%, a plausible FMCG distributor margin, but zcost itself
      is still pending full Tempo confirmation for this exact time period. Never claim this proxy measures Alfamart's
      own channel economics - zcost and the underlying sales here are General Trade, not Alfamart/B2B.
    synonyms:
    - promo roi
    - roi promo
    - promo investment
    - promo uplift
