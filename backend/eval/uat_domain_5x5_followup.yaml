        expect: { status: SUCCESS, strategy: governed, min_rows: 1 }
        judge: { criteria: ["Ranking material sell-in Tempo."] }
      - question: "untuk produk rank 1 dari tabel tadi, top 5 sales office dengan sell-in produk itu"
        expect: { status: SUCCESS, strategy: governed, min_rows: 0 }
        judge: { criteria: ["Follow-up referential ke material teratas; grain office+material masuk akal."] }

  - id: sales-fu-03
