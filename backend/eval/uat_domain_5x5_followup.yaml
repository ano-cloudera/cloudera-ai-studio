# 5 distinct sessions per domain · turn 1 + follow-up turn 2 (same session_id).
# Run: cd backend && python scripts/run_uat_domain_5x5_followup.py http://127.0.0.1:8000 gemini

version: 1
scope: TEMPO Q4 2024 · 5×2 turns per domain · OSSIE + follow-up

scenarios:
