    domain: sales
    title: Gross sell-in lalu breakdown bulan
    turns:
      - question: "Berapa total gross billing / sell-in TEMPO untuk Q4 2024?"
        expect: { status: SUCCESS, strategy: governed, min_rows: 1 }
        judge: { criteria: ["Agregat sell-in Tempo Q4; angka selaras data."] }
      - question: "tampilkan per bulan Oktober November Desember untuk pertanyaan tadi"
        expect: { status: SUCCESS, strategy: governed, min_rows: 1 }
        judge: { criteria: ["Follow-up terhadap sell-in; breakdown bulan Q4 2024."] }

  - id: sales-fu-02
    domain: sales
    title: Top material lalu drill office untuk rank 1
    turns:
