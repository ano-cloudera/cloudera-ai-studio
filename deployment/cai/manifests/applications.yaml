# Single source of truth for the Cloudera AI Applications (read by scripts/amp/deploy.py).
# `subdomain` is prefixed with AMP_SUBDOMAIN_PREFIX (default "anywhere"): <prefix>-<subdomain>.
# `environment` is set on the Application as written; `forward_env` copies the named variables from the
# project (or from AMP_FORWARD_ENV, a comma separated list of extra names) so secrets are entered once.
# `bypass_authentication: true` lets the other Applications call this one without a Cloudera AI login (the Backend and
# Qdrant are called server to server). The workspace admin must allow it (Site Administration -> Security).
# AMP_REQUIRE_LOGIN (comma separated keys) keeps the login on for the named Applications.
schema_version: 2
description: Anywhere AI Studio - Cloudera AI Applications (launchers only; app source in backend/ and frontend/)
subdomain_prefix: anywhere
shared_environment:
  STUDIO_REPO_ROOT: /home/cdsw
applications:
  - key: qdrant
    name: Anywhere Qdrant
    description: Vector database for document search
    subdomain: qdrant
    script: deployment/cai/launchers/studio-qdrant/app.py
    bypass_authentication: true
    resources: { cpu: 4, memory_gb: 16, nvidia_gpu: 0 }
    health_path: /readyz
    environment:
      QDRANT_BINARY: /home/cdsw/tools/qdrant/qdrant
      QDRANT_STORAGE_PATH: /home/cdsw/cai-studio-data/qdrant/storage
      QDRANT_STATIC_DIR: /home/cdsw/tools/qdrant/static
      APP_STARTUP_TIMEOUT_MINUTES: "5"
    forward_env: [QDRANT_API_KEY]
  - key: backend
    name: Anywhere Backend
    description: FastAPI backend (Ask Data, Knowledge, MCP, settings)
    subdomain: backend
    script: deployment/cai/launchers/studio-backend/app.py
    bypass_authentication: true
    resources: { cpu: 4, memory_gb: 16, nvidia_gpu: 0 }
    health_path: /health
    environment:
      PYTHON_EXECUTABLE: /home/cdsw/.venvs/studio-backend/bin/python
      DEPLOYMENT_PROFILE: cai
      STATE_STORE: sqlite
      UVICORN_WORKERS: "1"
      CAI_DATA_DIR: /home/cdsw/cai-studio-data
      DATABASE_URL: sqlite+pysqlite:////home/cdsw/cai-studio-data/metadata/studio.db
      DOCUMENT_STORAGE_ROOT: /home/cdsw/cai-studio-data/documents
      SEMANTIC_RUNTIME_STORAGE_ROOT: /home/cdsw/cai-studio-data/var/semantic-runtime
      QDRANT_COLLECTION: accelerator_chunks
      EMBEDDING_PROVIDER: bge_m3
      EMBEDDING_MODEL: /home/cdsw/models/bge-m3
      HF_HUB_OFFLINE: "1"
      APP_STARTUP_TIMEOUT_MINUTES: "10"
    forward_env:
      - GEMINI_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - QDRANT_API_KEY
      - TRINO_HOST
      - TRINO_PORT
      - TRINO_USER
      - TRINO_PASSWORD
      - TRINO_CATALOG
      - TRINO_SCHEMA
      - IMPALA_HOST
      - IMPALA_USER
      - IMPALA_PASSWORD
      - POSTGRES_PASSWORD
  - key: frontend
    name: Anywhere Frontend
    description: Next.js web UI
    subdomain: frontend
    script: deployment/cai/launchers/studio-frontend/app.py
    resources: { cpu: 2, memory_gb: 4, nvidia_gpu: 0 }
    health_path: /
    build: true
    environment:
      NODE_HOME: /home/cdsw/tools/node
      CAI_SKIP_FRONTEND_BUILD: "1"
      APP_STARTUP_TIMEOUT_MINUTES: "10"
      NEXT_PUBLIC_PRODUCT_NAME: Anywhere AI Studio
      NEXT_PUBLIC_PRODUCT_SHORT_NAME: Anywhere AI Studio
      NEXT_PUBLIC_APP_NAME: Anywhere AI Studio
      NEXT_PUBLIC_APP_SUBTITLE: Anywhere AI Studio
      NEXT_PUBLIC_APP_TAGLINE: Anywhere AI Studio
      NEXT_PUBLIC_SIDEBAR_FOOTER_CAPTION: Anywhere AI Studio
      NEXT_PUBLIC_SIDEBAR_POWERED_BY: Powered by Anywhere Cloud
      NEXT_PUBLIC_PRODUCT_LOGO: /branding/anywhere-ai-logo.png
      NEXT_PUBLIC_APP_LOGO: /branding/anywhere-ai-logo.png
      NEXT_PUBLIC_EMPTY_STATE_LOGO: /branding/anywhere-ai-logo.png
  # Optional: serve your own model on a GPU. Created only when ENABLE_VLLM=true (needs GPU nodes, a GPU runtime and weights on disk).
  - key: vllm
    name: Anywhere vLLM
    description: OpenAI-compatible model server
    subdomain: vllm
    enabled: false
    enabled_env: ENABLE_VLLM
    runtime_env: AMP_VLLM_RUNTIME_ID
    startup_timeout_s: 1800
    script: deployment/cai/launchers/studio-vllm/app.py
    resources: { cpu: 16, memory_gb: 64, nvidia_gpu: 1 }
    health_path: /health
    environment:
      PYTHON_EXECUTABLE: /home/cdsw/.venvs/studio-vllm/bin/python
      VLLM_MODEL: studio-llm
      HF_HUB_OFFLINE: "1"
      APP_STARTUP_TIMEOUT_MINUTES: "30"
    forward_env:
      - MODEL_PATH
      - GPU_PROFILE
      - TENSOR_PARALLEL_SIZE
      - MAX_MODEL_LEN
      - GPU_MEMORY_UTILIZATION
      - MAX_NUM_SEQS
      - VLLM_TOOL_CALL_PARSER
      - VLLM_API_KEY
