version: 0.2.0.dev0
name: registry_v30
description: Generated from PostgreSQL Semantic Registry (preview)
ai_context:
  instructions: Generated artifact — do not edit manually.
  synonyms:
  - Failed Transaction
  - High Risk
  - Priority Customer
  - Transaction Attempt
datasets:
- name: customers
  source: banking_demo.customers
  primary_key:
  - customer_id
  description: Customers
  fields:
  - name: city
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: city
    datatype: STRING
    dimension: {}
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
    datatype: INTEGER
    dimension: {}
  - name: customer_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_name
    datatype: STRING
    dimension: {}
  - name: customer_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_status
    datatype: STRING
    dimension: {}
  - name: join_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: join_date
    datatype: DATE
    dimension:
      is_time: true
  - name: risk_tier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: risk_tier
    datatype: STRING
    dimension: {}
  - name: segment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: segment
    datatype: STRING
    dimension: {}
- name: transactions
  source: banking_demo.transactions
  primary_key:
  - transaction_id
  description: Transactions
  fields:
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: DECIMAL
    dimension: {}
  - name: channel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: channel
    datatype: STRING
    dimension: {}
  - name: merchant_category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: merchant_category
    datatype: STRING
    dimension: {}
  - name: status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: STRING
    dimension: {}
  - name: transaction_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: transaction_date
    datatype: DATE
    dimension:
      is_time: true
  - name: transaction_month
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: transaction_date
    datatype: date
    dimension:
      is_time: true
  - name: transaction_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: transaction_type
    datatype: STRING
    dimension: {}
relationships:
- name: Transactions to Customers
  from: transactions
  to: customers
  relationship_type: many_to_one
  join_type: inner
  join_expression: a.customer_id = b.customer_id
  description: Many transactions belong to one customer.
metrics:
- name: active_customers
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN customer_status = 'Active' THEN customer_id
        END)
  datatype: Decimal
  description: Distinct customers whose customer_status is Active.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "customers", "allowed_dimensions": ["city", "customer_id",
      "customer_name", "customer_status", "join_date", "risk_tier", "segment"]}'
- name: average_transaction_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(amount)
  datatype: Decimal
  description: Average amount per transaction in the selected scope.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "transactions", "allowed_dimensions": ["amount", "channel",
      "merchant_category", "status", "transaction_date", "transaction_month", "transaction_type"]}'
- name: failed_transaction_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN status = 'Failed' THEN 1 ELSE 0 END)
  datatype: Decimal
  description: Count of transaction attempts with status Failed.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "transactions", "allowed_dimensions": ["amount", "channel",
      "merchant_category", "status", "transaction_date", "transaction_month", "transaction_type"]}'
- name: failed_transaction_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(CASE WHEN status = 'Failed' THEN 1.0 ELSE 0.0 END)
  datatype: Decimal
  description: Failed transaction attempts divided by total transaction attempts (aligned
    with Retail Banking Knowledge policy).
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "transactions", "allowed_dimensions": ["amount", "channel",
      "merchant_category", "status", "transaction_date", "transaction_month", "transaction_type"]}'
- name: successful_transaction_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN status = 'Success' THEN 1 ELSE 0 END)
  datatype: Decimal
  description: Count of transaction attempts with status Success.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "transactions", "allowed_dimensions": ["amount", "channel",
      "merchant_category", "status", "transaction_date", "transaction_month", "transaction_type"]}'
- name: total_transaction_amount
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(amount)
  datatype: Decimal
  description: Total monetary value of transactions in the selected scope.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "transactions", "allowed_dimensions": ["amount", "channel",
      "merchant_category", "status", "transaction_date", "transaction_month", "transaction_type"]}'
- name: transaction_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(transaction_id)
  datatype: Decimal
  description: Number of transaction attempts in the selected scope.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"base_dataset": "transactions", "allowed_dimensions": ["amount", "channel",
      "merchant_category", "status", "transaction_date", "transaction_month", "transaction_type"]}'
_registry_terms_count: 4
